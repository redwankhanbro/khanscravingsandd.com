<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sitemap</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #fff8f0;
      color: #3a2a1a;
      padding: 40px 20px;
    }

    /* Layout with sidebar */
    .layout {
      max-width: 1140px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 32px;
      align-items: start;
    }
    aside {
      position: sticky;
      top: 20px;
      background: #fff;
      border: 1px solid #f1dfcc;
      border-radius: 18px;
      padding: 20px 14px;
    }
    .brand { font-weight: 800; font-size: 1.2rem; color: #e8432e; padding: 0 10px 14px; }
    .nav-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9a7b60;
      padding: 16px 10px 6px;
    }
    .nav-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      text-decoration: none;
      color: #3a2a1a;
      font-weight: 600;
      text-transform: capitalize;
    }
    .nav-link:hover { background: #fff1e6; }
    .nav-link.active { background: #ff7a3d; color: #fff; }
    .nav-link.request { border: 2px dashed #ff7a3d; margin-top: 4px; }
    .nav-link.request.active { border-style: solid; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #2dc75c; }

    main { min-width: 0; }

    header {
      background: linear-gradient(135deg, #ff7a3d, #e8432e);
      color: #fff;
      border-radius: 20px;
      padding: 36px 32px;
      margin-bottom: 32px;
    }
    header h1 { font-size: 2rem; margin-bottom: 8px; text-transform: capitalize; }
    .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .pill {
      background: rgba(255,255,255,0.2);
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    h2 {
      font-size: 1.1rem;
      margin: 0 0 14px;
      color: #e8432e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    section { margin-bottom: 36px; }

    .spotlight, .card {
      width: 100%;
      text-align: left;
      font: inherit;
      color: inherit;
      background: #fff;
      cursor: pointer;
      transition: transform .15s, border-color .15s;
    }
    .spotlight { display: block; border: 2px solid #ff7a3d; border-radius: 18px; padding: 26px 28px; }
    .spotlight .page { font-size: 1.5rem; }
    .spotlight .when { font-size: 1rem; margin-top: 10px; }
    .grid { display: grid; gap: 14px; }
    .card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border: 1px solid #f1dfcc;
      border-radius: 14px;
      padding: 18px 22px;
    }
    .card:hover, .spotlight:hover { transform: translateY(-2px); border-color: #e8432e; }
    .page { font-weight: 700; font-size: 1.05rem; text-transform: capitalize; }
    .when { color: #6b5440; font-size: 0.9rem; margin-top: 6px; }
    .hint { color: #9a7b60; font-size: 0.8rem; margin-top: 6px; }
    .right { text-align: right; white-space: nowrap; }
    .ago {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #e8432e;
      background: #ffeee4;
      padding: 6px 12px;
      border-radius: 999px;
    }
    .new {
      display: inline-block;
      margin-left: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
      background: #2dc75c;
      padding: 3px 8px;
      border-radius: 999px;
      vertical-align: middle;
    }

    .boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .box { background: #fff; border: 1px solid #f1dfcc; border-radius: 14px; padding: 20px; text-align: center; }
    .box .num { font-size: 2rem; font-weight: 700; color: #e8432e; }
    .box .label { font-size: 0.85rem; color: #6b5440; margin-top: 4px; }

    .timeline { list-style: none; border-left: 3px solid #f8d3af; margin-left: 8px; }
    .timeline li { position: relative; padding: 0 0 18px 24px; }
    .timeline li::before {
      content: "";
      position: absolute;
      left: -9px; top: 4px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #ff7a3d;
    }
    .timeline li:first-child::before { background: #ff7a3d; }
    .timeline .t-date { font-weight: 600; }
    .timeline .t-ago { font-size: 0.85rem; color: #9a7b60; margin-top: 2px; }

    /* Request form */
    .form-card {
      background: #fff;
      border: 1px solid #f1dfcc;
      border-radius: 18px;
      padding: 28px;
    }
    .types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 22px; }
    .type input { position: absolute; opacity: 0; pointer-events: none; }
    .type span {
      display: block;
      text-align: center;
      padding: 16px 10px;
      border: 2px solid #f1dfcc;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
    }
    .type small { display: block; font-weight: 400; color: #9a7b60; margin-top: 4px; font-size: 0.8rem; }
    .type input:checked + span { border-color: #ff7a3d; background: #fff1e6; color: #e8432e; }
    .type input:focus-visible + span { outline: 3px solid #f8d3af; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-weight: 700; margin-bottom: 6px; }
    .field .opt { font-weight: 400; color: #9a7b60; font-size: 0.85rem; }
    .field .help { font-size: 0.82rem; color: #9a7b60; margin-top: 4px; }
    .field input, .field select, .field textarea {
      width: 100%;
      font: inherit;
      color: inherit;
      padding: 12px 14px;
      border: 1px solid #e8d4bf;
      border-radius: 10px;
      background: #fffcf8;
    }
    .field textarea { min-height: 110px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none;
      border-color: #ff7a3d;
      box-shadow: 0 0 0 3px #ffe3d1;
    }
    .divider { border: none; border-top: 1px solid #f1dfcc; margin: 6px 0 22px; }
    .sub { font-weight: 700; color: #e8432e; margin-bottom: 14px; }
    .hp { position: absolute; left: -9999px; }

    .submit {
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ff7a3d, #e8432e);
      border: none;
      border-radius: 999px;
      padding: 14px 30px;
      cursor: pointer;
    }
    .submit:disabled { opacity: 0.6; cursor: wait; }
    .notice { margin-top: 16px; padding: 14px 16px; border-radius: 12px; font-weight: 600; display: none; }
    .notice.ok { display: block; background: #eaf9ef; color: #067429; }
    .notice.err { display: block; background: #fff0f0; color: #bd0a0a; }
    .thanks { text-align: center; padding: 30px 10px; }
    .thanks h3 { font-size: 1.5rem; margin-bottom: 8px; color: #067429; }
    .thanks p { color: #6b5440; margin-bottom: 20px; }

    .msg { text-align: center; color: #9a7b60; padding: 40px 0; }
    footer { text-align: center; font-size: 0.85rem; color: #9a7b60; margin-top: 10px; }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; gap: 20px; }
      aside { position: static; display: flex; gap: 6px; overflow-x: auto; padding: 10px; }
      .brand, .nav-label { display: none; }
      .nav-link { white-space: nowrap; }
      .nav-link.request { margin-top: 0; }
    }
    @media (max-width: 560px) {
      .card { flex-direction: column; align-items: flex-start; }
      .right { text-align: left; }
      .boxes, .types, .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside id="sidebar"></aside>
    <main>
      <div id="app"><p class="msg">Loading sitemap...</p></div>
      <footer>Times are shown in your local time zone.</footer>
    </main>
  </div>

  <script>
    // ===== Settings =====
    const OWNER = "redwankhanbro";
    const REPO = "khanscravingsand";
    const NEW_DAYS = 7;
    const HISTORY = 30;
    // Paste your Formspree link here:
    const FORM_ENDPOINT = "https://formspree.io/f/YOUR_FORM_ID";
    const REQUEST_SLUG = "request-a-query";

    let pages = [];
    const app = document.getElementById("app");
    const sidebar = document.getElementById("sidebar");

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function slugOf(loc) {
      const file = loc.split("/").filter(Boolean).pop() || "";
      if (!file.includes(".html") || file === "index.html") return "home";
      return file.replace(".html", "");
    }

    function filePath(loc) {
      let path = loc.split("/" + REPO + "/")[1] || "";
      if (path === "" || path.endsWith("/")) path += "index.html";
      return path;
    }

    function timeAgo(date) {
      const sec = Math.floor((Date.now() - date) / 1000);
      const units = [["year", 31536000], ["month", 2592000], ["week", 604800],
                     ["day", 86400], ["hour", 3600], ["minute", 60]];
      for (const [name, size] of units) {
        const n = Math.floor(sec / size);
        if (n >= 1) return n + " " + name + (n > 1 ? "s" : "") + " ago";
      }
      return "just now";
    }

    function fullDate(date) {
      return date.toLocaleString(undefined, {
        year: "numeric", month: "long", day: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
    }

    function isNew(date) {
      return date && (Date.now() - date) / 86400000 <= NEW_DAYS;
    }

    // Gets only update TIMES from GitHub, never content or messages
    async function githubHistory(path) {
      const key = "smh_" + path;
      const cached = sessionStorage.getItem(key);
      if (cached) return JSON.parse(cached).map(d => new Date(d));
      try {
        const res = await fetch(
          `https://api.github.com/repos/${OWNER}/${REPO}/commits?path=${encodeURIComponent(path)}&per_page=${HISTORY}`
        );
        if (!res.ok) return null;
        const data = await res.json();
        const dates = data.map(c => c?.commit?.committer?.date).filter(Boolean);
        sessionStorage.setItem(key, JSON.stringify(dates));
        return dates.map(d => new Date(d));
      } catch { return null; }
    }

    // ===== Sidebar =====
    function renderSidebar(active) {
      sidebar.innerHTML = "";
      sidebar.appendChild(el("div", "brand", "Sitemap"));

      const link = (href, text, cls, showDot) => {
        const a = el("a", "nav-link" + (cls ? " " + cls : ""));
        a.href = href;
        a.appendChild(el("span", "", text));
        if (showDot) a.appendChild(el("span", "dot"));
        return a;
      };

      const overview = link("#", "Overview");
      if (active === "") overview.classList.add("active");
      sidebar.appendChild(overview);

      sidebar.appendChild(el("div", "nav-label", "Pages"));
      pages.forEach(p => {
        const a = link("#" + p.slug, p.name, "", isNew(p.date));
        if (active === p.slug) a.classList.add("active");
        sidebar.appendChild(a);
      });

      sidebar.appendChild(el("div", "nav-label", "Help us improve"));
      const req = link("#" + REQUEST_SLUG, "Request a query", "request");
      if (active === REQUEST_SLUG) req.classList.add("active");
      sidebar.appendChild(req);
    }

    function header(title, subtitle, pills) {
      const h = el("header");
      h.appendChild(el("h1", "", title));
      h.appendChild(el("p", "", subtitle));
      const s = el("div", "stats");
      pills.filter(Boolean).forEach(t => s.appendChild(el("span", "pill", t)));
      h.appendChild(s);
      return h;
    }

    function buildCard(p, spotlight) {
      const btn = el("button", spotlight ? "spotlight" : "card");
      btn.type = "button";
      btn.onclick = () => { location.hash = p.slug; };
      const left = el("div");
      const name = el("div", "page", p.name);
      if (isNew(p.date)) name.appendChild(el("span", "new", "New"));
      left.appendChild(name);
      left.appendChild(el("div", "when", p.date ? "Updated " + fullDate(p.date) : "Update time unknown"));
      left.appendChild(el("div", "hint", "Tap to see update history"));
      btn.appendChild(left);
      if (p.date) {
        const right = el("div", "right");
        right.appendChild(el("span", "ago", timeAgo(p.date)));
        btn.appendChild(right);
      }
      return btn;
    }

    // ===== Overview =====
    function renderList() {
      document.title = "Sitemap";
      app.innerHTML = "";
      const latest = pages[0];
      app.appendChild(header("Sitemap", "See when each page on the site was last updated.", [
        pages.length + " pages",
        latest?.date ? "Site last updated " + timeAgo(latest.date) : ""
      ]));
      const s1 = el("section");
      s1.appendChild(el("h2", "", "Latest update"));
      if (latest) s1.appendChild(buildCard(latest, true));
      app.appendChild(s1);
      const s2 = el("section");
      s2.appendChild(el("h2", "", "All pages, newest first"));
      const grid = el("div", "grid");
      pages.forEach(p => grid.appendChild(buildCard(p, false)));
      s2.appendChild(grid);
      app.appendChild(s2);
    }

    // ===== Page detail =====
    function renderDetail(p) {
      document.title = p.name + " | Sitemap";
      app.innerHTML = "";
      const count = p.dates.length;
      const totalLabel = count >= HISTORY ? HISTORY + "+" : String(count);
      app.appendChild(header(p.name, "Update activity for this page.", [
        p.date ? "Last updated " + timeAgo(p.date) : "Update time unknown",
        count ? totalLabel + " updates recorded" : ""
      ]));

      const s1 = el("section");
      s1.appendChild(el("h2", "", "Latest update"));
      const box = el("div", "spotlight");
      box.style.cursor = "default";
      const nm = el("div", "page", p.date ? fullDate(p.date) : "Unknown");
      if (isNew(p.date)) nm.appendChild(el("span", "new", "New"));
      box.appendChild(nm);
      if (p.date) box.appendChild(el("div", "when", timeAgo(p.date)));
      s1.appendChild(box);
      app.appendChild(s1);

      const now = Date.now();
      const in7 = p.dates.filter(d => now - d <= 7 * 86400000).length;
      const in30 = p.dates.filter(d => now - d <= 30 * 86400000).length;
      const s2 = el("section");
      s2.appendChild(el("h2", "", "Activity"));
      const boxes = el("div", "boxes");
      [[in7, "Updates in last 7 days"], [in30, "Updates in last 30 days"], [totalLabel, "Total updates"]]
        .forEach(([n, label]) => {
          const b = el("div", "box");
          b.appendChild(el("div", "num", String(n)));
          b.appendChild(el("div", "label", label));
          boxes.appendChild(b);
        });
      s2.appendChild(boxes);
      app.appendChild(s2);

      const s3 = el("section");
      s3.appendChild(el("h2", "", "Update history"));
      if (p.dates.length) {
        const ul = el("ul", "timeline");
        p.dates.forEach(d => {
          const li = el("li");
          li.appendChild(el("div", "t-date", fullDate(d)));
          li.appendChild(el("div", "t-ago", timeAgo(d)));
          ul.appendChild(li);
        });
        s3.appendChild(ul);
      } else {
        s3.appendChild(el("p", "msg", "No update history available yet."));
      }
      app.appendChild(s3);

      const s4 = el("section");
      const ask = el("a", "spotlight", "");
      ask.href = "#" + REQUEST_SLUG + "?page=" + encodeURIComponent(p.slug);
      ask.style.textDecoration = "none";
      ask.appendChild(el("div", "page", "Found a problem on this page?"));
      ask.appendChild(el("div", "when", "Send a request and tell us what should change."));
      s4.appendChild(ask);
      app.appendChild(s4);
    }

    // ===== Request a query =====
    function renderRequest(preselect) {
      document.title = "Request a query | Sitemap";
      app.innerHTML = "";
      app.appendChild(header("Request a query",
        "Spotted a problem, or want something changed? Tell us here.", [
          "Only the site owner sees your message",
          "Name and email are optional"
        ]));

      const card = el("div", "form-card");
      card.innerHTML = `
        <form id="reqForm" novalidate>
          <div class="types">
            <label class="type">
              <input type="radio" name="request_type" value="Problem" checked>
              <span>Report a problem<small>Something is broken or wrong</small></span>
            </label>
            <label class="type">
              <input type="radio" name="request_type" value="Update request">
              <span>Request an update<small>Something should change</small></span>
            </label>
            <label class="type">
              <input type="radio" name="request_type" value="Idea">
              <span>Share an idea<small>A suggestion or thought</small></span>
            </label>
          </div>

          <div class="row">
            <div class="field">
              <label for="page">Which page?</label>
              <select id="page" name="page"></select>
            </div>
            <div class="field">
              <label for="priority">How important is it?</label>
              <select id="priority" name="priority">
                <option>Low</option>
                <option selected>Medium</option>
                <option>High</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="title">Short title</label>
            <input id="title" name="title" maxlength="120" required
                   placeholder="For example: Menu prices are hard to read">
          </div>

          <div class="field">
            <label for="details">What's the problem or request?</label>
            <textarea id="details" name="details" maxlength="3000" required
                      placeholder="Describe what you noticed and why it matters to you."></textarea>
          </div>

          <hr class="divider">
          <p class="sub">Your ideas <span class="opt">(optional)</span></p>

          <div class="field">
            <label for="solution">How would you solve it? <span class="opt">(optional)</span></label>
            <textarea id="solution" name="solution" maxlength="3000"
                      placeholder="If you have a fix in mind, share it here."></textarea>
          </div>

          <div class="field">
            <label for="placement">Where or how should it appear on the site? <span class="opt">(optional)</span></label>
            <textarea id="placement" name="placement" maxlength="2000"
                      placeholder="For example: Put the drink sizes next to each price."></textarea>
          </div>

          <hr class="divider">

          <div class="row">
            <div class="field">
              <label for="name">Your name <span class="opt">(optional)</span></label>
              <input id="name" name="name" maxlength="80">
            </div>
            <div class="field">
              <label for="email">Your email <span class="opt">(optional)</span></label>
              <input id="email" name="email" type="email" maxlength="120">
              <div class="help">Only if you'd like a reply.</div>
            </div>
          </div>

          <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off">

          <button class="submit" type="submit">Send request</button>
          <div class="notice" id="notice" role="status"></div>
        </form>`;
      app.appendChild(card);

      // Page dropdown from the sitemap
      const select = card.querySelector("#page");
      const whole = el("option", "", "Whole site");
      whole.value = "Whole site";
      select.appendChild(whole);
      pages.forEach(p => {
        const o = el("option", "", p.name);
        o.value = p.name;
        if (p.slug === preselect) o.selected = true;
        select.appendChild(o);
      });

      const form = card.querySelector("#reqForm");
      const notice = card.querySelector("#notice");
      const btn = card.querySelector(".submit");

      const showError = text => {
        notice.className = "notice err";
        notice.textContent = text;
      };

      form.onsubmit = async e => {
        e.preventDefault();
        notice.className = "notice";

        const data = new FormData(form);
        if (data.get("_gotcha")) return; // spam bot

        if (!String(data.get("title")).trim() || !String(data.get("details")).trim()) {
          return showError("Please add a short title and describe the problem or request.");
        }
        const email = String(data.get("email")).trim();
        if (email && !form.email.checkValidity()) {
          return showError("That email doesn't look right. You can also leave it empty.");
        }
        if (FORM_ENDPOINT.includes("xkjjknvj")) {
          return showError("The request form isn't connected yet. Please try again later.");
        }

        data.append("_subject", "New " + data.get("request_type") + ": " + data.get("title"));
        btn.disabled = true;
        btn.textContent = "Sending...";

        try {
          const res = await fetch(FORM_ENDPOINT, {
            method: "POST",
            body: data,
            headers: { Accept: "application/json" }
          });
          if (!res.ok) throw new Error();
          card.innerHTML = "";
          const t = el("div", "thanks");
          t.appendChild(el("h3", "", "Thanks, your request was sent"));
          t.appendChild(el("p", "", "We read every message and use them to improve the site."));
          const again = el("button", "submit", "Send another request");
          again.type = "button";
          again.onclick = () => renderRequest(preselect);
          t.appendChild(again);
          card.appendChild(t);
        } catch {
          btn.disabled = false;
          btn.textContent = "Send request";
          showError("Something went wrong while sending. Please try again in a moment.");
        }
      };
    }

    // ===== Routing =====
    function route() {
      const raw = decodeURIComponent(location.hash.slice(1));
      const [slug, query] = raw.split("?");
      window.scrollTo(0, 0);

      if (slug === REQUEST_SLUG) {
        const pre = new URLSearchParams(query || "").get("page");
        renderSidebar(REQUEST_SLUG);
        return renderRequest(pre);
      }
      const p = pages.find(x => x.slug === slug);
      renderSidebar(p ? p.slug : "");
      p ? renderDetail(p) : renderList();
    }

    async function load() {
      try {
        const text = await (await fetch("sitemap.xml", { cache: "no-store" })).text();
        const xml = new DOMParser().parseFromString(text, "application/xml");
        const urls = [...xml.getElementsByTagName("url")];

        pages = await Promise.all(urls.map(async u => {
          const loc = u.getElementsByTagName("loc")[0]?.textContent.trim() || "";
          const lastmod = u.getElementsByTagName("lastmod")[0]?.textContent.trim();
          let dates = (await githubHistory(filePath(loc))) || [];
          if (!dates.length && lastmod) dates = [new Date(lastmod)];
          const slug = slugOf(loc);
          return {
            slug,
            name: slug === "home" ? "Home" : slug.replace(/[-_]/g, " "),
            dates,
            date: dates[0] || null
          };
        }));

        pages.sort((a, b) => (b.date || 0) - (a.date || 0));
        window.addEventListener("hashchange", route);
        route();
      } catch {
        app.innerHTML = '<p class="msg">Could not load the sitemap.</p>';
      }
    }

    load();
  </script>
</body>
