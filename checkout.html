<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Checkout Desk - Khan's Cravings</title>
    <style>
        :root { 
            --dark: #0A0A0A; 
            --sidebar-bg: #050505; 
            --card: #141414; 
            --orange: #FF6B01; 
            --green: #2ECC71;
            --text: #E0E0E0; 
            --border: #222;
        }
        html { scroll-behavior: smooth; }
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: var(--dark); color: var(--text); display: flex; }
        
        /* 🗺️ Sidebar Navigation Menu Framework */
        .sidebar { 
            width: 260px; height: 100vh; background: var(--sidebar-bg); position: fixed; 
            padding: 30px 20px; box-sizing: border-box; border-right: 1px solid #1a1a1a; 
            display: flex; flex-direction: column; justify-content: space-between; z-index: 100; 
        }
        .sidebar h2 { color: var(--orange); font-size: 22px; margin: 0 0 40px 0; text-transform: uppercase; letter-spacing: 1px; }
        .sidebar a { display: block; color: var(--text); text-decoration: none; padding: 12px 16px; margin: 6px 0; border-radius: 6px; font-weight: 600; transition: 0.3s; }
        .sidebar a:hover { background: var(--orange); color: white; }

        /* 🍱 Content Container Workspace */
        .content { margin-left: 260px; width: calc(100% - 260px); box-sizing: border-box; padding: 60px 50px; }
        .page-title { color: var(--orange); font-size: 32px; text-transform: uppercase; letter-spacing: 1px; margin-top: 0; margin-bottom: 40px; border-left: 4px solid var(--orange); padding-left: 15px; }
        
        .checkout-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 40px; max-width: 800px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .checkout-box h3 { color: white; font-size: 22px; margin-top: 0; margin-bottom: 25px; border-left: 4px solid var(--orange); padding-left: 15px; text-transform: uppercase; }
        
        /* 📋 Form Matrix Layout Grid */
        .checkout-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        .checkout-form label { color: #A0A0A0; font-size: 13px; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .checkout-form input, .checkout-form textarea { padding: 12px; background: #0A0A0A; border: 1px solid #333; border-radius: 6px; color: white; font-family: inherit; font-size: 14px; }
        .checkout-form input:focus, .checkout-form textarea:focus { border-color: var(--orange); outline: none; }
        
        /* Promo & VIP Code Row fields */
        .code-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
        .btn-verify { background: #222; color: #BBB; border: 1px solid #444; padding: 0 15px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; transition: 0.2s; }
        .btn-verify:hover { background: #333; color: white; border-color: #666; }

        .btn-place-order { background: var(--orange); color: white; border: none; padding: 16px; font-size: 16px; font-weight: 700; border-radius: 6px; cursor: pointer; grid-column: span 2; margin-top: 15px; text-transform: uppercase; transition: 0.3s; letter-spacing: 1px; }
        .btn-place-order:hover { background: #e05e00; box-shadow: 0 5px 15px rgba(255, 107, 1, 0.3); }
    </style>
</head>
<body>

    <!-- 🗺️ Sidebar Navigation Menu -->
    <nav class="sidebar">
        <div>
            <h2>Khan's Cravings</h2>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu Hub</a>
            <a href="drinks.html">Drinking Options</a>
            <a href="about.html">About Us</a>
            <a href="cart.html">Shopping Cart</a>
        </div>
    </nav>

    <!-- 🍱 Main Content Frame Area -->
    <main class="content">
        <h1 class="page-title">Instant Order Settlement Desk</h1>

        <div class="checkout-box">
            <h3>Complete Your Instant Purchase</h3>
            
            <form class="checkout-form" onsubmit="event.preventDefault(); alert('Your secure instant delivery order has been received! Our kitchen overlords have initialized preparation.');">
                
                <!-- 👤 Customer Information Fields -->
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" required placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" required placeholder="+1 (555) 000-0000">
                </div>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" required placeholder="name@domain.com">
                </div>
                
                <div class="form-group">
                    <label>Location / Neighborhood</label>
                    <input type="text" required placeholder="e.g. Manhattan, New York">
                </div>
                
                <div class="form-group full-width">
                    <label>Main Mailing Address (Full Delivery Details)</label>
                    <input type="text" required placeholder="123 Luxury Flame Street, Suite 4B">
                </div>
                
                <!-- 🎫 Promotional Verification Elements -->
                <div class="form-group">
                    <label>Apply Promo Code</label>
                    <div class="code-row">
                        <input type="text" placeholder="e.g. CRAVE10">
                        <button type="button" class="btn-verify" onclick="alert('Promo Code Applied Successfully!')">Apply</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Apply Restaurant VIP Code</label>
                    <div class="code-row">
                        <input type="text" placeholder="Enter Cardholder ID">
                        <button type="button" class="btn-verify" onclick="alert('VIP Privilege Privilege Verified! 15% custom tier multiplier injected.')">Verify</button>
                    </div>
                </div>
                
                <!-- 💬 Optional Additional Information Fields -->
                <div class="form-group full-width">
                    <label>Additional Delivery Info & Dietary Instructions (Optional)</label>
                    <textarea rows="4" placeholder="Specify any unique heat profiles, honey levels, gate access codes, or courier instructions..."></textarea>
                </div>
                
                <!-- 🚀 Submit Button -->
                <button type="submit" class="btn-place-order">Authorize & Place Instant Order</button>
            </form>
        </div>
    </main>

</body>
</html>
